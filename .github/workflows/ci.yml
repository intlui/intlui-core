name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:publication
      - run: npm test
      - run: npm run build
      - run: npm run build:profiles
      - run: npm run build:chat
      - run: npm run build:adapters
      - run: npm run build:advanced
